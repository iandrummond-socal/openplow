[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openplow"
version = "0.1.0"
description = "A model-agnostic vulnerability discovery harness built on the Cloudflare security-audit skill."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ian Drummond" }]
keywords = ["security", "vulnerability", "audit", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
# M1 uses only the standard library so the scaffold runs anywhere.
# Real model adapters (e.g. `anthropic`) are optional extras.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
# Full JSON-schema validation of findings; without it a minimal check is used.
schema = ["jsonschema>=4.0"]
# Runtime deps of the upstream benchmark targets (e.g. the JWT target needs a
# crypto library to import). Needed to run benchmarks/upstream, not the harness.
benchmarks = ["cryptography>=3.4"]
# ruff is pinned so a new release cannot change the lint rules under CI.
# cryptography is included so CI exercises the upstream benchmark targets.
dev = ["pytest>=8.0", "ruff==0.17.2", "jsonschema>=4.0", "cryptography>=3.4"]

[project.scripts]
openplow = "openplow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openplow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
