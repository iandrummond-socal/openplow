name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check openplow tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >= 3.11) and newest.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which
      # skipped every real-sandbox test. Lift it, and make a lost sandbox a red run.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # No API key: the suite runs on fake adapters and the fixture benchmarks.
      # -rs prints every skip's reason, so a skip can't hide in a green run.
      - run: python -m pytest -q -rs
        env:
          OPENPLOW_REQUIRE_SANDBOX: "1"
